version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: order_system_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-orders_system}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: order_system_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 9000
      DB_NAME: ${DB_NAME:-orders_system}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_HOST: db
      DB_PORT: 3306
      SECRET_KEY: ${SECRET_KEY:-default_secret_jwt_key_change_me_in_production}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000,http://localhost:5500}
    ports:
      - "9000:9000"
    volumes:
      - ./server/static:/app/static
      - ./server/logs:/app/logs

volumes:
  db_data:
